<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Power Dashboard - Front Page</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f7f9fc;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
            transition: background-color 0.3s, color 0.3s;
        }
        body.dark-mode {
            background: #121212;
            color: #e0e0e0;
        }
        .logo {
            width: 250px;
            height: 100px;
            margin-bottom: 20px;
        }
        .front-page {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
        }
        .front-page > div {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        button {
            background: #003366;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        button:hover {
            background: #004080;
        }
        body.dark-mode button {
            background: #333;
        }
        body.dark-mode button:hover {
            background: #555;
        }
        #dark-mode-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.3s;
        }
        #dark-mode-toggle:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        body.dark-mode #dark-mode-toggle {
            background: rgba(0, 0, 0, 0.2);
        }
        body.dark-mode #dark-mode-toggle:hover {
            background: rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <button id="dark-mode-toggle" title="Toggle Dark Mode">🌙</button>
    <div class="front-page">
        <img src="logo.jpg" alt="Solar Power Logo" class="logo">
        <h1>Welcome to the Solar Power Prediction Website</h1>
        <div class="buttons">
            <button id="menu-btn">Dashboard</button>
            <button id="search-btn">🔍</button>
            <button id="about-btn">About</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Solar Power Analysis Dashboard. All rights reserved. | <a href="#" target="_blank">Terms of Condition</a> | <a href="#" target="_blank">Privacy Policy</a></p>
    </footer>

    <script>
        const toggleButton = document.getElementById('dark-mode-toggle');
        const body = document.body;

        // Load dark mode preference
        if (localStorage.getItem('darkMode') === 'enabled') {
            body.classList.add('dark-mode');
            toggleButton.textContent = '☀️';
        }

        // Toggle dark mode
        toggleButton.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
            toggleButton.textContent = isDark ? '☀️' : '🌙';
        });

        document.getElementById('menu-btn').addEventListener('click', function() {
            window.location.href = 'index.html';
        });
        document.getElementById('search-btn').addEventListener('click', function() {
            alert('Search functionality coming soon!');
        });
        document.getElementById('about-btn').addEventListener('click', function() {
            window.location.href = 'about.html';
        });
    </script>
</body>
</html>
